[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pdf"
version = "0.2.0"
description = "A multilingual document question-answering app with source-grounded charts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.1,<2",
    "groq>=0.33,<1",
    "langchain-text-splitters>=1.0,<2",
    "langdetect>=1.0.9,<2",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.1,<2",
    "sentence-transformers>=5.1,<6",
    "streamlit>=1.50,<2",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "qdrant-client>=1.15,<2",
    "lancedb>=0.25,<1",
    "portalocker>=3,<4",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
crawl = [
    "scrapy==2.19.0",
    "trafilatura==2.0.0",
    "lxml>=5,<7",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
