[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pdf"
version = "0.1.0"
description = "A grounded PDF question-answering chatbot built with local embeddings and Groq."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.1,<2",
    "groq>=0.33,<1",
    "langchain-text-splitters>=1.0,<2",
    "langdetect>=1.0.9,<2",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.1,<2",
    "sentence-transformers>=5.1,<6",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
